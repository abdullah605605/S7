<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah Ansar | S6 Image Gallery</title>
    <link rel="icon" href="fav.ico">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header class="site-header">
        <div class="header-content">
            <h1>Contact us </h1>
          <p>
            Please complete the form below.
            We will get back to you as soon as possible.
        </p>
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="gallery.html" aria-current="page">Gallery</a>
                   <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

<section class="topics" id="contact">
    <div class="container">


        <form class="card"
              action="https://httpbin.org/post"
              method="post">
        
        <h2>Contact us</h2>

       
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                autocomplete="name"
                required
            >

            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >

            <label for="phone">Phone number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                autocomplete="tel"
            >

            <label for="subject">Contact subject</label>
            <select id="subject" name="subject" required>
                <option value="">Choose a subject</option>
                <option value="feedback">Feedback</option>
                <option value="question">Question</option>
                <option value="support">Support</option>
                <option value="other">Other</option>
            </select>

            <p>Preferred contact method</p>

            <label>
                <input
                    type="radio"
                    name="contact_method"
                    value="email"
                    required
                >
                Email
            </label>

            <label>
                <input
                    type="radio"
                    name="contact_method"
                    value="phone"
                >
                Phone
            </label>

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                rows="5"
                required
            ></textarea>

            <button type="submit">Submit</button>

        </form>

    </div>
</section>

     <footer>
      <p>Abdullah Ansar · Modified for Assignment S7</p>
    </footer>


    </body>
    </html>
